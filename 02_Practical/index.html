<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaBot – Student Assistant Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="chat-wrapper">
        <!-- Header Section -->
        <header class="chat-header">
            <div class="bot-info">
                <div class="avatar-container">
                    <span class="bot-avatar">🤖</span>
                    <span class="status-indicator" title="Online"></span>
                </div>
                <div class="title-area">
                    <h1>NovaBot</h1>
                    <p class="subtitle">Student Assistant Chatbot</p>
                </div>
            </div>
            <button id="clear-btn" class="clear-btn" title="Clear Chat History">Clear Chat</button>
        </header>

        <!-- Dynamic Message Stream -->
        <section id="chat-stream" class="chat-stream" aria-label="Chat Message Stream">
            <!-- Messages will be dynamically rendered here via JavaScript -->
        </section>

        <!-- Typing Indicator Container -->
        <div id="typing-indicator" class="typing-indicator hidden">
            <span class="bot-avatar-small">🤖</span>
            <div class="typing-bubbles">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
            <span class="typing-text">NovaBot is typing...</span>
        </div>

        <!-- Quick Suggestions Panel -->
        <section class="suggestions-panel" aria-label="Suggested Questions">
            <div id="suggestions-container" class="suggestions-container">
                <button class="chip-btn" data-query="What is HTML?">What is HTML?</button>
                <button class="chip-btn" data-query="What is CSS?">What is CSS?</button>
                <button class="chip-btn" data-query="What is JavaScript?">What is JavaScript?</button>
                <button class="chip-btn" data-query="What is FSD?">What is FSD?</button>
                <button class="chip-btn" data-query="Today's date">Today's date</button>
            </div>
        </section>

        <!-- Input Section -->
        <footer class="chat-input-area">
            <form id="chat-form" class="chat-form" onsubmit="return false;">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Type your question here (e.g., What is HTML?)..." 
                    autocomplete="off"
                    aria-label="Chat input message"
                >
                <button type="submit" id="send-btn" class="send-btn">
                    <span>Send</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
