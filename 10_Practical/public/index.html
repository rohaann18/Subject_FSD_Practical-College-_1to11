<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore and share memorable travel experiences.">
  <title>Travel Log</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      <div>
        <a class="site-title" href="index.html">Travel Log</a>
        <p class="site-subtitle">Explore and share travel experiences</p>
      </div>

      <nav class="main-nav" aria-label="Main navigation">
        <a class="active" href="index.html">Home</a>
        <a href="add-travel.html">Share Experience</a>
      </nav>
    </div>
  </header>

  <main class="page-container">
    <section class="section-heading">
      <div>
        <p class="eyebrow">Shared journeys</p>
        <h1>Travel Experiences</h1>
      </div>
      <a class="button button-primary" href="add-travel.html">Share Your Experience</a>
    </section>

    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

    <div id="travel-list" class="travel-grid" aria-live="polite">
      <p class="loading-message">Loading travel experiences...</p>
    </div>
  </main>

  <footer class="site-footer">
    <p>Travel Log &mdash; Keep your journeys remembered.</p>
  </footer>

  <script src="js/live-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
